spring:
  application:
    name: hrms
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ${AWS_REGION}
      s3:
        bucket: ${AWS_BUCKET_NAME}
server:
  port: 8080
  #servlet:
   # context-path: /api

# Logging
logging:
  level:
    org.httt2.hrms: TRACE
    org.hibernate.SQL: DEBUG

application:
  security:
    jwt:
      # This looks for the JWT_SECRET env var.
      # It must be at least 256-bit (32 characters+).
      secret-key: ${JWT_SECRET}

      # Expiration time in milliseconds.
      # Default: 86400000 (1 day) if not provided in env.
      expiration: ${JWT_EXPIRATION:86400000} # 1 day
  storage:
    type: s3
