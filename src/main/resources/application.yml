spring:
  application:
    name: hrms
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Increase pool size to handle SSE connections + regular API requests
      maximum-pool-size: 30
      minimum-idle: 5
      # Connection timeout (30 seconds)
      connection-timeout: 30000
      # Idle timeout (10 minutes)
      idle-timeout: 600000
      # Max lifetime (30 minutes)
      max-lifetime: 1800000
      # Leak detection threshold (60 seconds)
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ${AWS_REGION}
      s3:
        bucket: ${AWS_BUCKET_NAME}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  port: 8080
  #servlet:
  # context-path: /api

# Logging
logging:
  level:
    org.httt2.hrms: TRACE
    org.hibernate.SQL: DEBUG

application:
  security:
    jwt:
      # This looks for the JWT_SECRET env var.
      # It must be at least 256-bit (32 characters+).
      secret-key: ${JWT_SECRET}

      # Expiration time in milliseconds.
      # Default: 86400000 (1 day) if not provided in env.
      expiration: ${JWT_EXPIRATION:86400000} # 1 day
  storage:
    type: s3
  onboarding:
    base-url: ${ONBOARDING_BASE_URL:http://localhost:5173}
    token-expiration: ${ONBOARDING_TOKEN_EXPIRATION:604800000} # 7 days in milliseconds

rabbitmq:
  queue:
    send-email: sendEmail
    notification: notification
  exchange:
    name: ${RABBITMQ_EXCHANGE:hrms.exchange}
  routing-key:
    send-email: ${RABBITMQ_ROUTING_KEY_SEND_EMAIL:send.email}
    notification: ${RABBITMQ_ROUTING_KEY_NOTIFICATION:notification}
